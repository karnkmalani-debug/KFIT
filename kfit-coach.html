<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KFit Coach · Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700;800;900&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f0f0f;--surf:#1a1a1a;--surf2:#222;--surf3:#2a2a2a;
  --border:#2e2e2e;--text:#f0f0f0;--muted:#888;--muted2:#555;
  --sage:#6b8f71;--sage-d:#1a2b1c;--gold:#c9a84c;--gold-d:#2a2210;
  --terra:#c17a5a;--terra-d:#2a1a12;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:40px;}
.topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:22px;font-weight:900;letter-spacing:-1px;}<br>.logo span{color:var(--terra);}
.page-title{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.content{max-width:520px;margin:0 auto;padding:18px;}
.card{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
.card-title{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.stat-box{background:var(--surf2);border-radius:8px;padding:12px;text-align:center;}
.stat-val{font-size:26px;font-weight:900;}
.stat-lbl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-top:2px;}
.client-card{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .18s;}
.client-card:hover{border-color:var(--sage);}
.client-name{font-size:18px;font-weight:700;margin-bottom:4px;}
.client-meta{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;}
.client-meta span{display:flex;align-items:center;gap:4px;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;}
.badge-sage{background:var(--sage-d);color:var(--sage);border:1px solid var(--sage);}
.badge-gold{background:var(--gold-d);color:var(--gold);border:1px solid var(--gold);}
.badge-terra{background:var(--terra-d);color:var(--terra);border:1px solid var(--terra);}
.session-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.session-row:last-child{border-bottom:none;}
.back-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:7px 14px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;}
.pw-gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;}
.pw-box{background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:32px 28px;width:90%;max-width:360px;text-align:center;}
.pw-title{font-size:22px;font-weight:900;margin-bottom:6px;}
.pw-sub{font-size:14px;color:var(--muted);margin-bottom:20px;}
.pw-inp{width:100%;background:var(--surf2);border:1px solid var(--border);border-radius:10px;padding:13px 16px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;outline:none;margin-bottom:10px;}
.pw-btn{width:100%;padding:13px;background:var(--sage);border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:700;color:#fff;cursor:pointer;}
.pw-err{font-size:13px;color:var(--terra);margin-top:8px;min-height:18px;}
.empty{text-align:center;padding:40px 20px;color:var(--muted);}
.M{display:none;}
</style>
</head>
<body>

<!-- Password Gate -->
<div class="pw-gate" id="pwGate">
  <div class="pw-box">
    <div class="pw-title">K<span style="color:var(--terra)">F</span>it Coach</div>
    <div class="pw-sub">Attendance Dashboard</div>
    <input class="pw-inp" type="password" id="pwInp" placeholder="Password" onkeydown="if(event.key==='Enter')checkPw()">
    <button class="pw-btn" onclick="checkPw()">Enter</button>
    <div class="pw-err" id="pwErr"></div>
  </div>
</div>

<!-- Main -->
<div id="mainApp" style="display:none;">
  <div class="topbar">
    <div class="logo">K<span>F</span>it</div>
    <div class="page-title">Coach · Attendance</div>
  </div>

  <!-- Dashboard view -->
  <div class="content" id="dashView">
    <div class="stat-grid" id="overallStats"></div>
    <div style="font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;">Clients</div>
    <div id="clientList"><div class="empty">Loading...</div></div>
  </div>

  <!-- Client detail view -->
  <div class="content" id="clientView" style="display:none;">
    <div style="margin-bottom:14px;">
      <button class="back-btn" onclick="showDash()">← All Clients</button>
    </div>
    <div id="clientDetail"></div>
  </div>
</div>

<script>
const PW='kmfit2025';
const SB_URL='https://naabtmffdlgpjqmflscn.supabase.co';
const SB_KEY='sb_publishable_DcSjGaAuUJhGu_3lP82zNw_eKrGnpvz';
let sb=null;
let allRecords=[];

function getSB(){
  if(!sb)sb=supabase.createClient(SB_URL,SB_KEY);
  return sb;
}

function checkPw(){
  const val=document.getElementById('pwInp').value;
  if(val===PW){
    document.getElementById('pwGate').style.display='none';
    document.getElementById('mainApp').style.display='block';
    loadAll();
  } else {
    document.getElementById('pwErr').textContent='Incorrect password';
    document.getElementById('pwInp').value='';
    setTimeout(()=>document.getElementById('pwErr').textContent='',2500);
  }
}

function loadAll(){
  getSB().from('attendance')
    .select('*')
    .order('session_date',{ascending:false})
    .then(function(res){
      if(res.error){document.getElementById('clientList').innerHTML='<div class="empty">Error loading data.<br>'+res.error.message+'</div>';return;}
      allRecords=res.data||[];
      renderDash();
    });
}

function renderDash(){
  const now=new Date();
  const thisMonth=now.toISOString().slice(0,7);
  const total=allRecords.length;
  const monthCount=allRecords.filter(r=>r.session_date&&r.session_date.slice(0,7)===thisMonth).length;

  // Group by client
  const clients={};
  allRecords.forEach(r=>{
    const key=r.client_mobile||r.client_name;
    if(!clients[key]){clients[key]={name:r.client_name,mobile:r.client_mobile,records:[]};}
    clients[key].records.push(r);
  });
  const clientCount=Object.keys(clients).length;

  // Overall stats
  document.getElementById('overallStats').innerHTML=`
    <div class="stat-box"><div class="stat-val" style="color:var(--sage);">${clientCount}</div><div class="stat-lbl">Clients</div></div>
    <div class="stat-box"><div class="stat-val" style="color:var(--gold);">${monthCount}</div><div class="stat-lbl">This Month</div></div>
    <div class="stat-box"><div class="stat-val" style="color:var(--terra);">${total}</div><div class="stat-lbl">All Time</div></div>`;

  // Client cards
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  if(!clientCount){document.getElementById('clientList').innerHTML='<div class="empty">No attendance records yet.<br>Sessions will appear here once clients save them.</div>';return;}

  document.getElementById('clientList').innerHTML=Object.values(clients).map(c=>{
    const last=c.records[0];
    const lastDate=last?new Date(last.session_date+'T12:00:00'):null;
    const monthSessions=c.records.filter(r=>r.session_date&&r.session_date.slice(0,7)===thisMonth).length;
    const totalSessions=c.records.length;
    // Days since last session
    const daysSince=lastDate?Math.floor((now-lastDate)/86400000):null;
    const recencyBadge=daysSince===null?'':daysSince<=7?`<span class="badge badge-sage">Active</span>`:daysSince<=14?`<span class="badge badge-gold">${daysSince}d ago</span>`:`<span class="badge badge-terra">${daysSince}d ago</span>`;
    return`<div class="client-card" onclick="showClient('${(c.mobile||c.name).replace(/'/g,"\\'")}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
        <div class="client-name">${c.name}</div>
        ${recencyBadge}
      </div>
      <div class="client-meta">
        <span>📅 Last: ${lastDate?lastDate.getDate()+' '+M[lastDate.getMonth()]+' '+lastDate.getFullYear():'—'}</span>
        <span>🗓 This month: ${monthSessions}</span>
        <span>💪 Total: ${totalSessions}</span>
      </div>
    </div>`;
  }).join('');
}

function showClient(key){
  const c=Object.values(groupClients()).find(c=>(c.mobile||c.name)===key);
  if(!c)return;
  document.getElementById('dashView').style.display='none';
  document.getElementById('clientView').style.display='block';
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const now=new Date();
  const thisMonth=now.toISOString().slice(0,7);
  const monthSessions=c.records.filter(r=>r.session_date&&r.session_date.slice(0,7)===thisMonth).length;
  const rows=c.records.map(r=>{
    const d=new Date(r.session_date+'T12:00:00');
    return`<div class="session-row">
      <div>
        <div style="font-size:15px;font-weight:600;">${d.getDate()} ${M[d.getMonth()]} ${d.getFullYear()}</div>
        <div style="font-size:12px;color:var(--muted);">${r.session_time||''}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:12px;font-weight:700;color:var(--sage);">${r.workout_type||''}</div>
        ${r.duration_secs?`<div style="font-size:12px;color:var(--muted);">${Math.round(r.duration_secs/60)}m</div>`:''}
      </div>
    </div>`;
  }).join('');

  document.getElementById('clientDetail').innerHTML=`
    <div class="card" style="margin-bottom:14px;">
      <div style="font-size:22px;font-weight:800;margin-bottom:4px;">${c.name}</div>
      ${c.mobile?`<div style="font-size:13px;color:var(--muted);">📱 ${c.mobile}</div>`:''}
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-val" style="color:var(--sage);">${c.records.length}</div><div class="stat-lbl">Total</div></div>
      <div class="stat-box"><div class="stat-val" style="color:var(--gold);">${monthSessions}</div><div class="stat-lbl">This Month</div></div>
      <div class="stat-box"><div class="stat-val" style="color:var(--terra);">${calcStreak(c.records)}w</div><div class="stat-lbl">Streak</div></div>
    </div>
    <div class="card">
      <div class="card-title">Session History</div>
      ${rows||'<div style="color:var(--muted);">No sessions yet.</div>'}
    </div>`;
}

function showDash(){
  document.getElementById('clientView').style.display='none';
  document.getElementById('dashView').style.display='block';
}

function groupClients(){
  const clients={};
  allRecords.forEach(r=>{
    const key=r.client_mobile||r.client_name;
    if(!clients[key]){clients[key]={name:r.client_name,mobile:r.client_mobile,records:[]};}
    clients[key].records.push(r);
  });
  return clients;
}

function calcStreak(records){
  const weeks=new Set(records.map(r=>{
    const d=new Date(r.session_date+'T12:00:00');
    const jan1=new Date(d.getFullYear(),0,1);
    return d.getFullYear()+'-W'+Math.ceil(((d-jan1)/86400000+jan1.getDay()+1)/7);
  }));
  let streak=0;
  const td=new Date();
  for(let w=0;w<52;w++){
    const d=new Date(td);
    d.setDate(d.getDate()-(w*7));
    const jan1=new Date(d.getFullYear(),0,1);
    const wk=d.getFullYear()+'-W'+Math.ceil(((d-jan1)/86400000+jan1.getDay()+1)/7);
    if(weeks.has(wk))streak++;
    else if(w>0)break;
  }
  return streak;
}

document.getElementById('pwInp').addEventListener('keydown',function(e){
  if(e.key==='Enter')checkPw();
});
</script>
</body>
</html>
