<head>

<style>
:root{
  --bg:#12130F; --paper:#15160F; --card:#1C1D18; --ink:#F3EEE3; --ink2:#E4DED0; --soft:#C9C3B4; --muted:#9C978A;
  --line:#2E2F28; --line2:#3E3F36; --green:#2F6B4A; --green-d:#255A3D; --tint:#1E2B22; --mid:#5E8F6D; --sand:#26261F;
  --gold:#C9A24A; --leaf:#8FD1A2; --terra:#E39A6E;
  --surf:#1C1D18; --surf2:#26261F; --border:#2E2F28; --text:#F3EEE3; --sage:#6E9E7A;
  --serif:"Playfair Display","Noto Serif Devanagari",Georgia,serif; --sans:"DM Sans","Noto Sans Devanagari",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:var(--ink);-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
a{color:var(--green)}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative;padding-top:env(safe-area-inset-top,0px)}
.screen{padding:28px 20px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.screen.full{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
h1{margin:0;font-family:var(--serif);font-weight:500;font-size:31px;line-height:1.15}
h2{margin:0;font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.25}
.meta{font-size:14px;color:var(--muted);font-weight:600}
.cap{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.cap.g{color:var(--leaf)}
.card{background:var(--card);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}
.tint{background:var(--tint);border-radius:20px;padding:18px 20px}
.body{font-size:17px;line-height:1.6;color:var(--ink2)}
.body p{margin:0 0 14px}
.btn{min-height:52px;border-radius:16px;border:none;background:var(--green);color:#fff;font-weight:700;font-size:16px;padding:0 18px;width:100%}
.btn:active{background:var(--green-d)}
.btn.out{background:var(--card);color:var(--ink);border:1.5px solid var(--line2)}
.btn.link{background:none;color:var(--leaf);min-height:44px;width:auto;padding:0}
.btn[disabled]{opacity:.55}
.row{display:flex;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pill{min-height:48px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card);font-weight:700;font-size:15px;color:var(--ink)}
.pill.on{background:var(--green);border-color:var(--green);color:#fff}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:700;color:var(--soft)}
.field input,.field textarea,.field select{min-height:50px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card);padding:12px 14px;width:100%}
.field textarea{min-height:80px;resize:vertical}
.bar{display:flex;gap:4px}.bar i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.bar i.d{background:var(--green)}.bar i.p{background:var(--mid)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs nav{max-width:480px;margin:0 auto;display:flex;justify-content:space-around}
.tabs button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted);min-width:64px;padding:10px 0 12px;position:relative}
.tabs button.on{color:var(--green)}
.dot{position:absolute;top:6px;right:14px;width:9px;height:9px;border-radius:5px;background:#B86A3C}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;justify-content:space-between;align-items:center}
.round{width:44px;height:44px;border-radius:22px;border:none;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2A2B24;border:1px solid var(--line2);color:#F3EEE3;padding:12px 18px;border-radius:14px;font-size:15px;z-index:20;max-width:90%;text-align:center}
.jrow{display:flex;gap:14px;align-items:center;padding:10px 12px;border-radius:16px}
.jrow.now{background:var(--card)}
.jnum{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;background:var(--sand);color:var(--muted)}
.jnum.done{background:var(--green);color:#fff}.jnum.now{background:var(--card);border:2.5px solid var(--green);color:var(--green)}
.tpl{background:var(--card);border-radius:20px;padding:18px 20px;border:2px solid transparent;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.tpl.on{border-color:var(--green)}
.checks{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.checks i{height:28px;border-radius:8px;background:var(--line)}
.checks i.done{background:var(--green)}.checks i.partly{background:var(--mid)}
.player{background:#0B0C09;color:#F3EEE3;min-height:100vh;display:flex;flex-direction:column;gap:20px;padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(32px + env(safe-area-inset-bottom,0px))}
.player .bar i{background:#5A534A}.player .bar i.d{background:var(--bg)}.player .bar i.p{background:var(--mid)}
.still{background:#F6F1E9;border-radius:24px;aspect-ratio:1/1;max-height:46vh;display:flex;align-items:center;justify-content:center}
.pline{margin:0;font-family:var(--serif);font-size:23px;line-height:1.38;min-height:4.2em}
.pctl{margin-top:auto;display:flex;justify-content:center;align-items:center;gap:28px}
.pctl button{width:52px;height:52px;border-radius:26px;border:1.5px solid #6A675C;background:transparent;color:#F3EEE3;display:flex;align-items:center;justify-content:center}
.pctl button.big{width:68px;height:68px;border-radius:34px;border:none;background:#F3EEE3;color:#12130F}
.meal{background:var(--card);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.meal img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--sand)}
.hands{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--soft)}
.hands b{color:var(--green)}
.msg{max-width:82%;padding:10px 14px;border-radius:16px;font-size:16px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px}
.msg small{display:block;font-size:12px;opacity:.7;margin-top:4px}
.center{text-align:center}
.hide{display:none!important}
.q{display:flex;flex-direction:column;gap:6px}
.q span{font-weight:700;font-size:15px}
.screen{padding-bottom:calc(36px + env(safe-area-inset-bottom,0px))!important}
.brand{font-family:var(--serif);font-size:15px;letter-spacing:.2em}.brand .k{color:#fff}.brand .f{color:#6FA27B}.brand .i{color:#C8734A}
.brand small{font-family:var(--sans);font-size:11px;letter-spacing:.3em;color:var(--muted);margin-left:6px}
.goldline{height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center;text-align:left;width:100%;color:var(--ink)}
.tile.main{border-color:#3D6B4F}
.tile .ic{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tile h2{font-size:21px}
.stat{border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .l{font-size:11px;letter-spacing:.15em;color:var(--muted)}
.stat .v{font-family:var(--serif);font-size:24px}
.coachbox{background:var(--card);border:1px solid #6B5A2A;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.cnote{background:#2A2618;border:1px solid #6B5A2A;color:#E7CF8C;border-radius:8px;padding:3px 8px;font-size:13px;display:inline-block;margin-top:3px}
.steplbl{font-size:12px;letter-spacing:.12em;color:var(--gold);font-weight:700}
.links{display:flex;flex-wrap:wrap;gap:10px}
.links button{background:none;border:1px solid var(--line2);border-radius:20px;color:var(--soft);padding:8px 14px;font-weight:700;font-size:14px;min-height:40px}
.tm{color:var(--muted);font-variant-numeric:tabular-nums;min-width:62px;display:inline-block}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;color:var(--ink)}
.mcard .sum{display:flex;gap:10px;align-items:center}
.mthumb{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--sand);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px}
.addgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.addgrid button{border:1px dashed var(--line2);background:none;border-radius:12px;min-height:44px;color:var(--leaf);font-weight:700;font-size:14px}
.hbtn{border:1px solid var(--line2);background:none;border-radius:10px;min-height:40px;color:var(--ink);font-weight:700;font-size:14px}
.hbtn.on{background:var(--green);border-color:var(--green);color:#fff}
.hdot{width:14px;height:14px;border-radius:7px;display:inline-block;border:1px solid var(--line2);background:transparent}
.hdot.d{background:var(--leaf);border-color:var(--leaf)}.hdot.p{background:#4E7A5C;border-color:#4E7A5C}.hdot.n{background:#3A2A1E;border-color:#3A2A1E}.hdot.t{border:2px solid var(--gold)}
.f-time{font-family:"DM Mono",ui-monospace,Menlo,monospace;color:var(--gold);font-size:13px;letter-spacing:.02em}
.f-meal{font-family:var(--serif);font-size:18px;font-weight:500;color:var(--ink)}
.f-food{font-family:var(--sans);font-size:15px;color:var(--soft);line-height:1.45}
.hint{background:var(--tint);border:1px solid #2C4234;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.hint p{margin:0;font-size:15px;line-height:1.5;color:var(--ink2)}
.hint .row{gap:14px}
.hint button{background:none;border:none;padding:6px 0;font-weight:700;font-size:14px;color:var(--leaf);min-height:36px}
.helpbtn{width:40px;height:40px;border-radius:20px;border:1px solid var(--line2);background:var(--card);font-weight:700;font-size:17px;color:var(--gold);flex-shrink:0}
.langbtn{width:40px;height:40px;border-radius:20px;border:1px solid var(--line2);background:var(--card);font-size:16px;flex-shrink:0}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.unit{display:inline-flex;border:1.5px solid var(--line2);border-radius:12px;overflow:hidden}
.unit button{border:none;background:var(--card);padding:6px 12px;font-weight:700;font-size:13px;min-height:34px}
.unit button.on{background:var(--green);color:#fff}
.fhelp{font-size:13px;color:var(--muted);line-height:1.4}
</style>
</head>

<div class="app" id="app"></div>
<div class="tabs hide" id="tabs"><nav>
  <button data-tab="today"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>

</nav></div>
<input type="file" accept="image/*" id="photoInput" class="hide">
<script>
(function(){
'use strict';
// ------------------------------------------------------------------
// KFit Nutrition Coach. One habit at a time. Data lives in
// nutrition_program / nutrition_checkins / nutrition_meals (rows, with
// database security). Uses the same sign-in phone links as the trackers.
// ------------------------------------------------------------------
var GEMINI_WORKER='https://kfit-gemini.karnkmalani.workers.dev';
var LS={mobile:'kmnut_mobile',name:'kfnc_name',coach:'kmnut_coach_id',cache:'kfnc_cache',queue:'kfnc_queue'};
var G_H=typeof KFIT_HABITS!=='undefined'?KFIT_HABITS:[], G_R=typeof KFIT_RESET!=='undefined'?KFIT_RESET:null, G_T=typeof KFIT_TEMPLATES!=='undefined'?KFIT_TEMPLATES:[];
var G_URL=typeof SB_URL!=='undefined'?SB_URL:null, G_KEY=typeof SB_KEY!=='undefined'?SB_KEY:null;
var G_COACH=typeof KFIT_DEFAULT_COACH_ID!=='undefined'?KFIT_DEFAULT_COACH_ID:null, G_MAX=typeof MAX_BYTES!=='undefined'?MAX_BYTES:20971520;
var HABITS={}; G_H.forEach(function(h){HABITS[h.id]=h;});
if(G_R) HABITS.reset=G_R;
var TEMPLATES={}; G_T.forEach(function(t){TEMPLATES[t.id]=t;});
var TPL_BLURB={
  'reset-7d':'One small shift a day. A calm, quick start.',
  'foundations-1m':'Protein, vegetables, eating order and your plate, one week each.',
  'core-3m':'Six habits at a gentle two-week pace, so they really stick.',
  'complete-6m':'The whole journey, eleven habits, at your own pace.'
};

var sb=null, S={notes:[],
  uid:null, mobile:'', clientId:'', fitId:'', linkedFitness:false,
  program:null, checkins:{}, meals:{}, messages:[], tab:'home', view:null, busy:false
};

// ---------- small helpers ----------
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return (n<10?'0':'')+n;}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return dstr(new Date());}
function parseD(s){var p=String(s||'').split('-');return new Date(+p[0],(+p[1]||1)-1,+p[2]||1);}
function addDays(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return dstr(d);}
function daysBetween(a,b){return Math.round((parseD(b)-parseD(a))/86400000);}
function now(){return Date.now();}
function uid(){return 'm'+now().toString(36)+Math.random().toString(36).slice(2,7);}
function toast(t){var el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(function(){el.remove();},2600);}
function coachId(){
  var p=new URLSearchParams(location.search).get('coach');
  if(p){localStorage.setItem(LS.coach,p);return p;}
  return localStorage.getItem(LS.coach)||G_COACH;
}
function partOfDay(){var h=new Date().getHours();return h>=5&&h<12?'Good morning':h>=12&&h<17?'Good afternoon':h>=17&&h<22?'Good evening':'Good night';}
function greet(){return partOfDay()+'.';}
function saveCache(){try{localStorage.setItem(LS.cache,JSON.stringify({cid:S.clientId,program:S.program,checkins:S.checkins,meals:S.meals}));}catch(e){}}
function loadCache(){try{var c=JSON.parse(localStorage.getItem(LS.cache)||'null');if(c&&c.cid===S.clientId){S.program=c.program;S.checkins=c.checkins||{};S.meals=c.meals||{};}}catch(e){}}

// ---------- write queue (works offline, retries later) ----------
function withTimeout(p,ms){ return Promise.race([p,new Promise(function(r){ setTimeout(function(){ r({error:{message:'timeout'}}); },ms); })]); }
function queue(){try{return JSON.parse(localStorage.getItem(LS.queue)||'[]');}catch(e){return [];}}
function setQueue(q){localStorage.setItem(LS.queue,JSON.stringify(q));}
var KEYS={nutrition_program:'client_id',nutrition_checkins:'client_id,day',nutrition_meals:'client_id,meal_id'};
function write(table,row){
  var q=queue().filter(function(x){return !(x.t===table&&sameKey(table,x.r,row));});
  q.push({t:table,r:row}); setQueue(q); saveCache(); return flush();
}
function sameKey(t,a,b){return KEYS[t].split(',').every(function(k){return a[k]===b[k];});}
var flushing=null;
// A network problem pauses the queue and retries later. A save the database
// REJECTS is set aside (with the reason) so it can never block the meals
// behind it; set-aside items are retried on each sync and shown to her.
function failedQ(){try{return JSON.parse(localStorage.getItem('kfnc_failed')||'[]');}catch(e){return [];}}
function setFailed(f){try{localStorage.setItem('kfnc_failed',JSON.stringify(f.slice(-50)));}catch(e){}}
function isNetErr(e){ var m=String(e&&(e.message||e)||''); return !navigator.onLine||/fetch|network|Load failed|timeout|aborted|offline|Failed to/i.test(m)||(e&&(e.status===0||e.code==='')); }
function flush(){
  if(flushing) return flushing.then(function(){ return queue().length?flush():null; });
  flushing=(async function(){
    // give earlier set-aside saves another chance, at the back of the line
    var f=failedQ(); if(f.length){ setFailed([]); var q0=queue(); f.forEach(function(x){ if(!q0.some(function(y){return y.t===x.t&&sameKey(x.t,y.r,x.r);})) q0.push({t:x.t,r:x.r,tries:(x.tries||0)}); }); setQueue(q0); }
    var skipped=[];
    for(;;){
      var q=queue().filter(function(x){return skipped.indexOf(JSON.stringify(x))<0;}); if(!q.length) break;
      var it=q[0], sent=JSON.stringify(it);
      try{
        var res=await sb.from(it.t).upsert(it.r,{onConflict:KEYS[it.t]});
        if(res.error) throw res.error;
      }catch(e){
        if(isNetErr(e)){ console.warn('KFit: offline, will retry',it.t,e&&e.message); break; }
        // rejected: set it aside with the reason, keep going with the rest
        console.warn('KFit: save rejected, set aside',it.t,e&&e.message);
        var ff=failedQ(); ff.push({t:it.t,r:it.r,tries:(it.tries||0)+1,why:String(e&&(e.message||e.code)||'rejected').slice(0,200),at:Date.now()}); setFailed(ff);
        setQueue(queue().filter(function(x){ return JSON.stringify(x)!==sent; }));
        skipped.push(sent); continue;
      }
      setQueue(queue().filter(function(x){ return JSON.stringify(x)!==sent; }));
    }
  })().finally(function(){ flushing=null; try{ syncBanner(); }catch(e){} });
  return flushing;
}
// A small note when something hasn't reached the coach yet
function syncBanner(){
  var waiting=queue().length, failed=failedQ().length, el=document.getElementById('syncNote');
  if(!waiting&&!failed){ if(el) el.remove(); return; }
  if(!el){ el=document.createElement('button'); el.id='syncNote'; el.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;border:1px solid #6B5A2A;background:#2A2618;color:#E7CF8C;border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px;font-family:inherit;text-align:left'; document.body.appendChild(el);
    el.onclick=function(){ el.textContent='Sending…'; flush(); }; }
  var why=failed?(failedQ()[0].why||''):'';
  el.innerHTML=esc((navigator.onLine?'':'No internet · ')+(waiting+failed)+' item'+((waiting+failed)===1?'':'s')+' not sent to your coach yet · tap to retry')+(why?'<div style="font-weight:400;font-size:11px;opacity:.75;margin-top:2px">'+esc(why)+'</div>':'');
}
setInterval(function(){ if(queue().length||failedQ().length) flush(); },60000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&(queue().length||failedQ().length)) flush(); });
window.addEventListener('online',function(){flush();});

// ---------- lessons & program logic ----------
function tpl(){return S.program&&TEMPLATES[S.program.template_id];}
function hasPlan(){return !!tpl();}
function stepId(i){var t=tpl();return t&&t.path[i==null?S.program.step_index:i];}

// ---------- Lessons in other languages: the AI translates each habit once,
// then it's kept on the phone (instant after that; English until ready). ----------
var TR_KEYS=['title','short','checkin','action','moveOnText','stayText','line','visual','label','prompt','text'];
var TR_ARRAYS=['read','questions'];
function trCollect(obj){
  var refs=[];
  (function walk(o,key){
    if(Array.isArray(o)){
      o.forEach(function(x,i){ if(typeof x==='string'){ if(TR_ARRAYS.indexOf(key)>=0) refs.push([o,i]); } else walk(x,key); });
    } else if(o&&typeof o==='object'){
      Object.keys(o).forEach(function(k){ var v=o[k]; if(typeof v==='string'){ if(TR_KEYS.indexOf(k)>=0&&/[A-Za-z]{2}/.test(v)) refs.push([o,k]); } else walk(v,k); });
    }
  })(obj,'');
  return refs;
}
var trApplied={}, trBusy={};
function trCacheKey(key){return 'kfit_tr2_'+kLang()+'_'+key;}
function applyTr(obj,key){
  try{ var c=JSON.parse(localStorage.getItem(trCacheKey(key))||'null'); var refs=trCollect(obj);
    if(!Array.isArray(c)||c.length!==refs.length) return false;
    refs.forEach(function(r,i){ if(typeof c[i]==='string'&&c[i]) r[0][r[1]]=c[i]; }); return true;
  }catch(e){ return false; }
}
async function trChunk(list){
  var L=KFitI18n.aiName(), hi=kLang()==='hi';
  var prompt='Translate each string in this JSON array from English to '+L+'. Keep the same order and exactly the same number of items. '
    +'Keep "KFit", numbers, times and emoji unchanged. Hand portions: palm = '+(hi?'हथेली':'palma')+', fist = '+(hi?'मुट्ठी':'puño')+', cupped hand = '+(hi?'अंजुली':'mano ahuecada')+', thumb = '+(hi?'अँगूठा':'pulgar')+'. '
    +(hi?'Keep food and everyday words people normally say in English (protein, carbs, salad, Greek yogurt, snack, kcal) in Devanagari transliteration. ':'Use common Spanish food names. ')
    +'Tone: warm, simple, encouraging, never preachy. Reply ONLY with a JSON array of strings.\n'+JSON.stringify(list);
  var r=await fetch(GEMINI_WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.2,maxOutputTokens:8192,responseMimeType:'application/json',thinkingConfig:{thinkingBudget:0}}})});
  var j=await r.json(); var t=j&&j.candidates&&j.candidates[0]&&j.candidates[0].content&&(j.candidates[0].content.parts||[]).map(function(q){return q.text||'';}).join('');
  var a=JSON.parse(String(t||'').replace(/```json|```/g,'').trim());
  if(!Array.isArray(a)||a.length!==list.length) throw new Error('length mismatch');
  return a.map(function(x,i){return typeof x==='string'&&x.trim()?x:list[i];});
}
async function translateObj(obj,key){
  var refs=trCollect(obj), src=refs.map(function(r){return r[0][r[1]];}), out=[];
  for(var i=0;i<src.length;i+=40){ out=out.concat(await trChunk(src.slice(i,i+40))); }
  try{ localStorage.setItem(trCacheKey(key),JSON.stringify(out)); }catch(e){}
  return applyTr(obj,key);
}
function trEnsure(key,obj){
  if(kLang()==='en'||!obj||trApplied[key]) return;
  if(applyTr(obj,key)){ trApplied[key]=1; return; }
  if(trBusy[key]) return; trBusy[key]=1;
  if(!trEnsure._toast){ trEnsure._toast=1; setTimeout(function(){ toast(kLang()==='hi'?'पाठ आपकी भाषा में तैयार हो रहे हैं…':'Preparando las lecciones en tu idioma…'); },300); }
  translateObj(obj,key).then(function(ok){ trBusy[key]=0; if(ok){ trApplied[key]=1; try{ render(); }catch(e){} } },function(){ trBusy[key]=0; });
}
// the lesson days of a habit at this template's pace
function stepDays(id){
  var h=habitOf(id), t=tpl(); if(!h) return [];
  if(id==='reset'||id==='start'||!t||!t.pace||t.pace>=h.days.length) return h.days;
  var n=t.pace, first=h.days.slice(0,n-1), last=h.days[h.days.length-1];
  return first.concat([last]);  // last day = the habit's own decision
}
function stepLen(id){return stepDays(id).length;}
function dayIndex(){
  var id=stepId(); var n=daysBetween(S.program.step_started_on||today(),today());
  return Math.max(0,Math.min(n,stepLen(id)-1));
}
function currentLesson(){var id=stepId();var d=stepDays(id);return d[dayIndex()]||null;}
function isDecisionDay(){var l=currentLesson();return !!(l&&l.decision);}
function checkinText(){
  var l=currentLesson(), h=habitOf(stepId());
  if(l&&l.checkin!==undefined) return l.checkin;
  return h?h.checkin:null;
}
function stepCheckins(){
  var start=S.program.step_started_on||today(), len=stepLen(stepId()), out=[];
  for(var i=0;i<len;i++){var d=addDays(start,i);var c=S.checkins[d];out.push(d>today()?'future':(c&&c.answer)||'');}
  return out;
}
function mostlyDone(){
  var cs=stepCheckins().filter(function(x){return x!=='future';});
  var done=cs.filter(function(x){return x==='done';}).length, partly=cs.filter(function(x){return x==='partly';}).length;
  return cs.length>0 && (done+partly*0.5)>=cs.length*0.65;
}
function completedHabits(){
  var out={}; (S.program.history||[]).forEach(function(h){if(h.type==='moveOn')out[h.step]=1;}); return out;
}

// ---------- supabase ----------

// Client apps keep their OWN sign-in, separate from Merge (the coach app) on
// the same phone. Before, a coach testing a client app on their own phone was
// seen as the coach ("Coach accounts can't sign up as clients", email code
// errors). A client's existing anonymous sign-in is carried over once, so
// nobody is logged out; a coach's sign-in is never copied.
var KFIT_CLIENT_AUTH='kfit-client-auth';
function kfitClientAuthMigrate(url){
  try{
    if(localStorage.getItem(KFIT_CLIENT_AUTH)) return;
    var ref=(String(url).match(/https:\/\/([^.]+)\./)||[])[1]; if(!ref) return;
    var old=localStorage.getItem('sb-'+ref+'-auth-token'); if(!old) return;
    var o=JSON.parse(old), tok=o&&(o.access_token||(o.currentSession&&o.currentSession.access_token)); if(!tok) return;
    var b=tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4) b+='=';
    var claims=JSON.parse(atob(b));
    if(claims&&claims.is_anonymous===true) localStorage.setItem(KFIT_CLIENT_AUTH,old);
  }catch(e){}
}
function initSB(){ kfitClientAuthMigrate(G_URL); sb=window.supabase.createClient(G_URL,G_KEY,{auth:{storageKey:KFIT_CLIENT_AUTH,persistSession:true,autoRefreshToken:true}}); }
async function ensureAuth(){
  var r=await sb.auth.getSession(); var s=r.data&&r.data.session;
  if(!s){ var a=await sb.auth.signInAnonymously(); if(a.error) throw a.error; s=a.data.session; }
  S.uid=s.user.id; return S.uid;
}

}
async function loadAll(){

function commentsFor(day,mealId){return (S.comments||[]).filter(function(c){return c.day===day&&(mealId?c.meal_id===mealId:!c.meal_id);});}
function unreadCoach(){return (S.comments||[]).filter(function(c){return c.author==='coach'&&!c.read_by_client_at;});}
function updateBadge(){
  var n=unreadCoach().length+(S.notes||[]).filter(function(x){return !x.read_at;}).length;
  try{ if(navigator.setAppBadge){ if(n) navigator.setAppBadge(n); else navigator.clearAppBadge(); } }catch(e){}

function markThreadRead(list){
  var ids=list.filter(function(c){return c.author==='coach'&&!c.read_by_client_at;}).map(function(c){return c.id;});

var speaking=false, speakCb=null;
// A warm female voice from the phone (never the male Indian-English one);
// read in short phrases with natural pauses, like a person talking.
var VOICE_PREF=['samantha','ava','karen','serena','tessa','google us english','google uk english female','moira','aria','jenny','zira','victoria','allison','susan','fiona'];
var VOICE_AVOID=/rishi|daniel|alex|fred|aaron|arthur|google uk english male|male/i;
var VOICE_PREF_L={hi:['lekha','kiyara','swara','neerja','google हिन्दी','hindi'],es:['monica','mónica','paulina','marisol','helena','sabina','dalia','elvira','google español']};
var VOICE_AVOID_L=/rishi|hemant|prabhat|madhur|jorge|diego|juan|carlos|pablo|alvaro|álvaro/i;
function voice(){
  var L=kLang();
  if(L!=='en'){
    var lv=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(function(v){return v.lang.toLowerCase().indexOf(L)===0&&!VOICE_AVOID_L.test(v.name);});
    var pl=VOICE_PREF_L[L]||[];
    for(var j=0;j<pl.length;j++){var fv=lv.filter(function(v){return v.name.toLowerCase().indexOf(pl[j])>=0;})[0];if(fv)return fv;}
    if(lv.length) return lv[0];
  }
  var vs=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(function(v){return /^en/i.test(v.lang)&&!VOICE_AVOID.test(v.name);});
  for(var i=0;i<VOICE_PREF.length;i++){var f=vs.filter(function(v){return v.name.toLowerCase().indexOf(VOICE_PREF[i])>=0;})[0];if(f)return f;}
  return vs.filter(function(v){return /en-(US|GB|AU)/i.test(v.lang);})[0]||vs[0]||null;
}
if(window.speechSynthesis){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=function(){}; }catch(e){} }
function phrases(text){
  return (String(text||'').match(/[^.!?:;,।]+[.!?:;,।]?/g)||[]).map(function(x){return x.trim();}).filter(Boolean);
}
function speak(parts,done){
  stopSpeech(); if(!window.speechSynthesis){if(done)done();return;}
  if(window.KFitI18n&&kLang()!=='en') parts=parts.map(function(x){return KFitI18n.t(x);});
  speaking=true; speakCb=done; var i=0, bits=[];
  parts.forEach(function(p){ bits=bits.concat(phrases(p)); bits.push(''); });
  (function next(){
    if(!speaking) return;
    if(i>=bits.length){speaking=false;if(speakCb)speakCb();return;}
    var t=bits[i++];
    if(!t){ return setTimeout(next,500); }                       // pause between paragraphs
    var u=new SpeechSynthesisUtterance(t); var v=voice(); if(v){u.voice=v;u.lang=v.lang;} else if(kLang()!=='en'){ u.lang=KFitI18n.locale(); }
    u.rate=0.96; u.pitch=1.12;
    var gap=/[.!?]$/.test(t)?380:/[:;]$/.test(t)?260:160;       // natural pauses
    var goOn=function(){ if(speaking) setTimeout(next,gap); };
    u.onend=goOn; u.onerror=goOn; speechSynthesis.speak(u);
  })();
}
function stopSpeech(){speaking=false;speakCb=null;if(window.speechSynthesis)speechSynthesis.cancel();}
var STILLS=[
  '<circle cx="120" cy="120" r="96" stroke="#CFC6B8" stroke-width="3"/><circle cx="120" cy="120" r="72" stroke="#E6DFD3" stroke-width="2"/><path d="M92 112a28 20 0 0 1 56 0" stroke="#2E5E4E" stroke-width="4"/>',
  '<path d="M60 150c20-70 100-70 120 0" stroke="#2E5E4E" stroke-width="4"/><circle cx="120" cy="96" r="14" stroke="#B86A3C" stroke-width="3"/>',
  '<rect x="64" y="64" width="112" height="112" rx="28" stroke="#2E5E4E" stroke-width="4"/><path d="M92 120h56M120 92v56" stroke="#9DBDAF" stroke-width="4"/>',
  '<path d="M50 150c30-10 40-60 70-60s40 50 70 60" stroke="#2E5E4E" stroke-width="4"/><circle cx="170" cy="70" r="14" stroke="#B86A3C" stroke-width="3"/>',
  '<circle cx="96" cy="120" r="30" stroke="#2E5E4E" stroke-width="4"/><circle cx="150" cy="120" r="20" stroke="#9DBDAF" stroke-width="4"/>'
];
function openExplainer(h){
  var ex=h.explainer, i=0, playing=false;
  S.view=function(){draw();};
  function draw(){
    var sc=ex.scenes[i];
    var bar=ex.scenes.map(function(_,k){return '<i class="'+(k<i?'d':k===i?'p':'')+'"></i>';}).join('');
    show('<div class="player"><div class="bar">'+bar+'</div>'
      +'<div class="top" style="font-size:14px;font-weight:600;color:#CFC6B8"><span>'+esc(ex.title)+'</span><span>'+(i+1)+' of '+ex.scenes.length+'</span></div>'
      +'<div class="still"><svg width="60%" viewBox="0 0 240 240" fill="none" stroke-linecap="round" stroke-linejoin="round">'+STILLS[i%STILLS.length]+'</svg></div>'
      +'<p class="pline">'+esc(sc.line)+'</p>'
      +'<div class="pctl"><button id="pxPrev" aria-label="Previous"><svg class="icon" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>'
      +'<button class="big" id="pxPlay" aria-label="'+(playing?'Stop voice':'Listen')+'" style="font-size:24px">'+(playing?'<svg class="icon" viewBox="0 0 24 24" style="stroke-width:2.4"><path d="M9 5v14M15 5v14"/></svg>':'🔊')+'</button>'
      +'<button id="pxNext" aria-label="Next"><svg class="icon" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>'
      +'<button class="btn link" id="pxClose" style="color:#CFC6B8;align-self:center">Close</button></div>');
    $('#pxPrev').onclick=function(){if(i>0){i--;restart();}};
    $('#pxNext').onclick=function(){if(i<ex.scenes.length-1){i++;restart();}else close();};
    $('#pxPlay').onclick=function(){playing=!playing;token++;clearTimeout(timer);if(playing)say();else stopSpeech();draw();};
    $('#pxClose').onclick=close;
  }
  var timer=null, token=0;
  function restart(){stopSpeech();clearTimeout(timer);draw();if(playing)say();}
  function advance(){ if(!playing) return; if(i<ex.scenes.length-1){i++;draw();say();} else {playing=false;draw();} }
  function say(){
    var my=++token, t0=Date.now(), line=ex.scenes[i].line;
    clearTimeout(timer);
    speak([line],function(){
      if(my!==token||!playing) return;
      // No voice on this phone (speech ended instantly): show each scene
      // for a comfortable reading time instead of racing ahead.
      var spent=Date.now()-t0, need=Math.max(3500,line.split(/\s+/).length*380);
      if(spent<need*0.5) timer=setTimeout(function(){ if(my===token) advance(); },need-spent);
      else advance();
    });
  }
  function close(){playing=false;token++;clearTimeout(timer);stopSpeech();S.view=null;render();}
  playing=false; draw();
}

// When the calorie estimate didn't come back (no signal, AI busy), try again.
async function retryEstimate(mealId){
  var m=S.meals[mealId]; if(!m) return; var b=m.body||{};
  toast('Estimating…');
  try{
    var ps=mealPhotos(b), done=false;
    if(ps.length){
      for(var i=0;i<ps.length;i++){ if(ps[i].feedback&&ps[i].feedback.kcal) continue;
        var u=await sb.storage.from('kfit-meals').createSignedUrl(ps[i].path,600); if(!u.data) continue;
        var blob=await (await fetch(u.data.signedUrl)).blob(); ps[i].feedback=await handFeedback(blob,b.text||''); done=true; }
      b.photos=ps; delete b.photo;
    } else if(b.text){ var ri=await aiItems(null,b.text); if(ri.items.length){ b.items=ri.items; b.feedback=itemsFeedback(ri.items,ri.tip); } done=!!b.feedback; }
    var f=aggFeedback(b);
    if(!f||!f.kcal){ toast('Still no estimate. Please try again a bit later.'); return; }
    m.body=b; m.updated_ms=now(); await write('nutrition_meals',mealRow(m)); renderLog(); toast('Estimate added');
  }catch(e){ toast('Still no estimate. Please try again a bit later.'); }
}

    +'<div class="body" style="font-size:15px"><p style="margin:0">Everything you logged in the earlier version of the app. It\'s saved, and your coach can see it too.</p></div>';
  days.slice(0,S._earlierN||14).forEach(function(d){
    html+='<div class="card"><div style="font-weight:700">'+esc(d.label)+'</div>'
      +d.meals.map(function(m){return '<div style="font-size:15px;line-height:1.45"><b>'+esc(m.name)+'</b>'+(m.score!=null?' <span class="meta">· '+esc(LEGACY_SCORE[m.score]||'')+'</span>':'')
        +(m.text?'<br><span style="color:var(--soft)">'+esc(m.text)+'</span>':'')+'</div>';}).join('')
      +(d.note?'<div class="meta" style="font-weight:400">Note: '+esc(d.note)+'</div>':'')+'</div>';
  });
  if(days.length>(S._earlierN||14)) html+='<button class="btn out" id="elMore">Show more</button>';
  html+='</div>';
  show(html,{tabs:true}); bindLogSwitch();
  var mo=$('#elMore'); if(mo) mo.onclick=function(){S._earlierN=(S._earlierN||14)+14;renderEarlier();};
}

// ---------- The earlier app's log: kept, shown, and backed up to the coach ----------
// The earlier nutrition tracker saved each day on the phone (km_nut_*) and to
// the person's tracker_data record. Nothing here ever deletes it. On open,
// the phone's copy and the saved copy are combined (no day is lost from
// either side), saved back, and shown under Log > Earlier.
var LEGACY_SCORE={0:'Skipped',1:'Poor',2:'OK',3:'Good'};
var LEGACY_MEALS=[['breakfast','Breakfast'],['msnack','Morning snack'],['lunch','Lunch'],['esnack','Evening snack'],['dinner','Dinner']];
function lsJSON(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function legacyName(){var st=lsJSON('km_nut_setup',null);return st&&st.clientName||'';}
function dayHasContent(x){
  if(!x||typeof x!=='object') return false;
  var any=function(o){return o&&typeof o==='object'&&Object.keys(o).some(function(k){var v=o[k];return v!==''&&v!=null&&v!==false&&!(Array.isArray(v)&&!v.length);});};
  return any(x.meals)||any(x.mealNotes)||any(x.foodLog)||!!(x.note&&String(x.note).trim())||any(x.habits);
}
function dayWeight(x){try{return dayHasContent(x)?JSON.stringify(x).length:0;}catch(e){return 0;}}
function mergeLegacyDays(a,b){
  // nested [month][week][day]; keep every day that has content on either side
  if(!Array.isArray(a)) return Array.isArray(b)?b:[];
  if(!Array.isArray(b)) return a;
  var out=[], n=Math.max(a.length,b.length);
  for(var i=0;i<n;i++){
    var x=a[i], y=b[i];
    if(Array.isArray(x)||Array.isArray(y)) out[i]=mergeLegacyDays(x,y);
    else out[i]=dayWeight(y)>dayWeight(x)?y:(x!=null?x:y);
  }
  return out;
}
function legacyCalendarDate(setup,m,w,di){
  var p=String(setup.startDate||'').split('-'); if(p.length<3) return null;
  var ms=new Date(+p[0],+p[1]-1,+p[2]); ms.setMonth(ms.getMonth()+m);
  var ws=new Date(ms); ws.setDate(ws.getDate()-ws.getDay()); ws.setDate(ws.getDate()+w*7+di);
  return ws;
}
function legacyDayList(setup,data){
  var out=[]; if(!setup||!Array.isArray(data)) return out;
  data.forEach(function(month,m){(month||[]).forEach(function(week,w){(week||[]).forEach(function(day,di){
    if(!dayHasContent(day)) return;
    var dt=legacyCalendarDate(setup,m,w,di); if(!dt) return;
    var meals=[];
    LEGACY_MEALS.forEach(function(mm){
      var sc=day.meals&&day.meals[mm[0]], nt=day.mealNotes&&day.mealNotes[mm[0]], fl=day.foodLog&&day.foodLog[mm[0]];
      var text=[].concat(Array.isArray(fl)?fl:[]).concat(nt?[nt]:[]).join(', ');
      if(sc!=null||text) meals.push({name:mm[1],score:(sc!=null&&LEGACY_SCORE[sc]!=null)?sc:null,text:text});
    });
    out.push({date:dstr(dt),label:dt.toDateString().slice(0,10),meals:meals,note:day.note||''});
  });});});
  return out.sort(function(a,b){return a.date<b.date?1:-1;});
}
// The earlier app also had a separate calorie log: {log:{'YYYY-MM-DD':[{label,amount}]}}.
function addCalorieLog(days,cal){
  var log=cal&&cal.log; if(!log||typeof log!=='object') return days;
  Object.keys(log).forEach(function(d){
    var items=(log[d]||[]).filter(function(e){return e&&(e.label||e.amount);}); if(!items.length) return;
    var day=days.filter(function(x){return x.date===d;})[0];
    if(!day){ day={date:d,label:parseD(d).toDateString().slice(0,10),meals:[],note:''}; days.push(day); }
    if(day.meals.some(function(m){return m.name==='Calorie log';})) return;
    day.meals.push({name:'Calorie log',score:null,text:items.map(function(e){return (e.label||'Entry')+(e.amount?' ('+e.amount+' kcal)':'');}).join(', ')});
  });
  return days.sort(function(a,b){return a.date<b.date?1:-1;});
}
// Everything the earlier app kept on this phone, copied as-is to the
// person's record (data.phoneBackup) so nothing can be lost in any format.
function phoneSnapshot(){
  var out={}, n=0;
  try{ Object.keys(localStorage).forEach(function(k){
    if(!/^(km_|kmnut_)/.test(k)||/sync_base|_uid$/.test(k)) return;
    var v=localStorage.getItem(k); if(!v||v==='[]'||v==='{}'||v.length>600000) return;
    out[k]=v; n++;
  }); }catch(e){}
  return n?out:null;
}
function sig(str){var h=0;for(var i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))|0;}return String(h)+':'+str.length;}
async function syncLegacy(){
  var localSetup=lsJSON('km_nut_setup',null), localData=lsJSON('km_nut_data',[]), localMeas=lsJSON('km_nut_measurements',[]);
  var srv=null;
  try{
    var r=await sb.from('tracker_data').select('data').eq('client_id',S.clientId).eq('tracker','nutrition');
    if(!r.error&&r.data&&r.data[0]){ srv=r.data[0].data; if(typeof srv==='string'){try{srv=JSON.parse(srv);}catch(e){srv=null;}} }
  }catch(e){}
  if(srv&&srv.wiped) srv=null;
  var hasLocal=Array.isArray(localData)&&localData.length&&JSON.stringify(localData).length>20;
  var setup=(srv&&srv.setup&&srv.setup.startDate)?srv.setup:localSetup;
  // Days are stored by position from the start date, so two copies can only
  // be combined if they share a start date. Otherwise show both, save neither.
  if(hasLocal&&srv&&srv.setup&&localSetup&&srv.setup.startDate&&localSetup.startDate&&srv.setup.startDate!==localSetup.startDate){
    var a1=legacyDayList(srv.setup,srv.data||[]), b1=legacyDayList(localSetup,localData), byDate={};
    a1.concat(b1).forEach(function(d){var o=byDate[d.date];if(!o||JSON.stringify(d).length>JSON.stringify(o).length)byDate[d.date]=d;});
    S.legacyDays=Object.keys(byDate).map(function(k){return byDate[k];}).sort(function(x,y){return x.date<y.date?1:-1;});
    return;
  }
  var merged=mergeLegacyDays(srv&&srv.data||[],hasLocal?localData:[]);
  var calAll={log:Object.assign({},(srv&&srv.calories&&srv.calories.log)||{},(lsJSON('kmnut_calories',{})||{}).log||{})};
  S.legacyDays=addCalorieLog(legacyDayList(setup,merged),calAll);
  var snap=phoneSnapshot(), snapSig=snap?sig(JSON.stringify(snap)):null;
  var needSnap=!!(snap&&(srv||setup)&&localStorage.getItem('kfnc_phone_backup')!==snapSig);
  var needDays=!!(hasLocal&&setup&&JSON.stringify(merged)!==JSON.stringify(srv&&srv.data||[]));
  // Save back if the phone had anything the server didn't (days, or its raw copy).
  if(needDays||needSnap){
    var meas=(srv&&srv.bodyMeasurements)||[], ids={};
    meas.forEach(function(x){if(x&&x.id)ids[x.id]=1;});
    (Array.isArray(localMeas)?localMeas:[]).forEach(function(x){if(x&&x.id&&!ids[x.id])meas.push(x);});
    var body=Object.assign({},srv||{},{setup:setup||(srv&&srv.setup)||null,data:needDays?merged:(srv&&srv.data||[]),bodyMeasurements:meas,mobile:S.mobile});
    if(snap) body.phoneBackup={savedAt:new Date().toISOString(),keys:snap};
    var lc=lsJSON('kmnut_calories',null); if(lc&&lc.log&&!(srv&&srv.calories)) body.calories=lc;
    if(!body.weekNotes){var wn=lsJSON('km_nut_notes',null); if(wn) body.weekNotes=wn;}
    try{
      var up=await sb.from('tracker_data').upsert({client_id:S.clientId,tracker:'nutrition',data:body,updated_at:new Date().toISOString()},{onConflict:'client_id,tracker'});
      if(up.error) console.warn('KFit: earlier log not saved yet, will retry',up.error.message);
      else if(snapSig) localStorage.setItem('kfnc_phone_backup',snapSig);
    }catch(e){ console.warn('KFit: earlier log not saved yet, will retry'); }
  }
}

function openWeekly(){
  var cur=((S.checkins[today()]||{}).reflection||{}).measure||{};
  S.view=openWeekly;
  show('<div class="screen full"><div class="top"><button class="round" id="wkBack" aria-label="Back"><svg class="icon" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span></span></div>'
    +'<h1>Weekly check-in</h1>'
    +'<div class="body" style="font-size:16px"><p style="margin:0">Same time each week works best: in the morning, before breakfast. Measure your waist at the belly button. Both are optional.</p></div>'
    +'<div class="field"><label for="wkWaist">Waist (cm)</label><input id="wkWaist" inputmode="decimal" value="'+esc(cur.waist||'')+'"></div>'
    +'<div class="field"><label for="wkWeight">Weight (kg)</label><input id="wkWeight" inputmode="decimal" value="'+esc(cur.weight||'')+'"></div>'
    +'<button class="btn" id="wkSave">Save</button></div>');
  $('#wkBack').onclick=function(){S.view=null;render();};
  $('#wkSave').onclick=function(){
    function num(id,lo,hi){var v=parseFloat(String($(id).value).replace(',','.'));return isFinite(v)&&v>=lo&&v<=hi?Math.round(v*10)/10:null;}
    var w=num('#wkWaist',40,250), kg=num('#wkWeight',25,350);
    if(w==null&&kg==null){toast('Add your waist, your weight, or both');return;}
    var d=today(), p=S.checkins[d]||{}, r=Object.assign({},p.reflection||{});
    r.measure={}; if(w!=null) r.measure.waist=w; if(kg!=null) r.measure.weight=kg;
    var row={client_id:S.clientId,day:d,step_id:p.step_id||(hasPlan()?stepId():null),lesson_day:p.lesson_day||(hasPlan()?dayIndex()+1:null),answer:p.answer||null,lesson_read:!!p.lesson_read,reflection:r,updated_ms:now()};
    S.checkins[d]=row; write('nutrition_checkins',row); toast('Saved. See you next week.'); renderProgress();
  };
}

async function loadMessages(){}
async function checkUnread(){
  if(typeof KFitChat==='undefined'||!S.fitId) return;
  try{ var r=await KFitChat.unread(sb,'client',S.fitId); S.unread=(r.data||[]).length; }catch(e){ S.unread=0; }

function renderChat(){
  S.tab='chat';

function boot(){
  app=$('#app');
  document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){go(b.dataset.tab);};});
  if(!window.supabase||!G_URL){ show('<div class="screen"><h1>Can\'t connect</h1><div class="body">Please check your internet connection and reopen the app.</div></div>'); return; }
  initSB();
  var m=(localStorage.getItem(LS.mobile)||'').replace(/\D/g,'');
  if(m.length<8) return renderSignIn();
  setMobile(m); loadCache();
  try{ S.legacyDays=addCalorieLog(legacyDayList(lsJSON('km_nut_setup',null),lsJSON('km_nut_data',[])),lsJSON('kmnut_calories',null)); }catch(e){}
  if(S.program){ S.view=null; render(); }
  ensureAuth().then(checkLinked).then(function(ok){
    if(ok) return enter();
    if(!S.program) renderAccess();
  }).catch(function(){ if(!S.program) renderSignIn('We couldn\'t connect just now. Check your internet and try again.'); });
}
