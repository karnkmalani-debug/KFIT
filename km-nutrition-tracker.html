<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KFit Nutrition">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf8f3">
<title>KFit Nutrition Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{
  --bg:#faf8f3;--surf:#ffffff;--surf2:#f3f0e9;--surf3:#ece8df;--border:#e0dbd0;
  --sage:#4a8050;--sage-l:#6a9e6e;--sage-d:rgba(74,128,80,.1);
  --terra:#b85e3a;--terra-d:rgba(184,94,58,.1);
  --gold:#a07830;--gold-d:rgba(160,120,48,.1);
  --txt:#2c2a26;--txt2:#6a6660;--txt3:#a09890;--white:#fff;
  --score-high:#4a8050;--score-mid:#a07830;--score-low:#b85e3a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;min-height:100%;}
body{overflow-x:hidden;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;background:var(--bg);}
.brand{font-family:'Playfair Display',serif;font-size:1.35rem;color:var(--txt);}
.brand span{color:var(--sage);}
.save-pill{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.08em;padding:4px 10px;border-radius:20px;background:var(--sage-d);color:var(--sage);border:1px solid rgba(74,128,80,.25);opacity:0;transition:opacity .4s;}
.save-pill.show{opacity:1;}
/* month tabs */
.month-tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--surf);gap:0;scrollbar-width:none;}
.month-tabs::-webkit-scrollbar{display:none;}
.mtab{flex-shrink:0;padding:12px 20px;font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--txt3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.mtab.active{color:var(--sage);border-bottom-color:var(--sage);}
/* setup */
.setup-card{margin:20px 16px;background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:20px;}
.setup-title{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--txt);margin-bottom:14px;}
.field-label{font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--txt3);margin-bottom:6px;}
.field-inp{width:100%;background:var(--surf2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-family:'DM Sans',sans-serif;font-size:.9rem;color:var(--txt);margin-bottom:14px;}
.field-inp:focus{outline:none;border-color:var(--sage);}
.start-btn{width:100%;padding:14px;border-radius:10px;border:none;background:var(--sage);color:#fff;font-size:.9rem;font-weight:700;cursor:pointer;}
.start-btn:active{opacity:.8;}
/* week sections */
.week-section{margin:16px 16px 0;background:var(--surf);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.week-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.week-label{font-size:.82rem;font-weight:700;color:var(--txt);}
.week-score{font-family:'DM Mono',monospace;font-size:.82rem;font-weight:500;}
.week-body{display:none;}
.week-body.open{display:block;}
/* day tabs within week */
.day-strip{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);scrollbar-width:none;}
.day-strip::-webkit-scrollbar{display:none;}
.dtab{flex-shrink:0;padding:10px 14px;font-size:.72rem;font-weight:600;color:var(--txt3);cursor:pointer;border-bottom:2px solid transparent;text-align:center;white-space:nowrap;}
.dtab.active{color:var(--sage);border-bottom-color:var(--sage);}
.dtab.done{color:var(--sage-l);}
.day-panel{padding:16px;}
/* meals */
.meal-item{margin-bottom:14px;background:var(--surf2);border-radius:12px;padding:14px;}
.meal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.meal-name{font-size:.82rem;font-weight:700;color:var(--txt);}
.meal-score-row{display:flex;gap:8px;}
.score-btn{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);background:var(--surf);font-family:'DM Mono',monospace;font-size:.82rem;font-weight:700;color:var(--txt3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.score-btn:active{transform:scale(.93);}
.score-btn.s1.active{background:var(--terra-d);border-color:var(--terra);color:var(--terra);}
.score-btn.s2.active{background:var(--gold-d);border-color:var(--gold);color:var(--gold);}
.score-btn.s3.active{background:var(--sage-d);border-color:var(--sage);color:var(--sage);}
.score-btn.s0.active{background:#f0ece4;border-color:var(--txt3);color:var(--txt3);}
.meal-note-inp{width:100%;background:var(--surf);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:.8rem;color:var(--txt);resize:none;margin-top:6px;}
.meal-note-inp:focus{outline:none;border-color:var(--sage);}
.meal-note-inp::placeholder{color:var(--txt3);}
/* habits */
.habits-section{margin:0 16px 16px;padding:14px;background:var(--surf);border:1px solid var(--border);border-radius:12px;}
.habit-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;}
.habit-row:last-child{margin-bottom:0;}
.habit-check{width:24px;height:24px;border-radius:6px;border:2px solid var(--border);background:var(--surf2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.habit-check.checked{background:var(--sage-d);border-color:var(--sage);}
.habit-check.checked::after{content:'';display:block;width:6px;height:10px;border:2px solid var(--sage);border-top:none;border-left:none;transform:rotate(45deg) translateY(-1px);}
.habit-text{font-size:.8rem;color:var(--txt2);line-height:1.5;}
.habit-tip{font-size:.72rem;color:var(--sage);margin-top:3px;font-style:italic;}
/* day notes */
.day-notes-wrap{margin:0 16px 16px;}
.day-notes-inp{width:100%;background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:12px;font-family:'DM Sans',sans-serif;font-size:.82rem;color:var(--txt);resize:none;min-height:70px;}
.day-notes-inp:focus{outline:none;border-color:var(--sage);}
.day-notes-inp::placeholder{color:var(--txt3);}
/* week summary */
.week-summary{margin:0 16px 16px;padding:14px;background:var(--sage-d);border:1px solid rgba(74,128,80,.2);border-radius:12px;}
.wsum-title{font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--sage);margin-bottom:10px;}
.wsum-bars{display:flex;gap:4px;align-items:flex-end;height:50px;margin-bottom:8px;}
.wbar{flex:1;border-radius:4px 4px 0 0;min-height:4px;transition:height .3s;}
.wsum-row{display:flex;justify-content:space-between;font-size:.72rem;color:var(--txt2);}
.week-notes-inp{width:100%;margin-top:10px;background:var(--surf);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:.8rem;color:var(--txt);resize:none;}
.week-notes-inp:focus{outline:none;border-color:var(--sage);}
.week-notes-inp::placeholder{color:var(--txt3);}
/* month summary */
.month-summary{margin:16px 16px 0;padding:16px;background:var(--surf);border:1px solid var(--border);border-radius:14px;}
.mscore{font-family:'Playfair Display',serif;font-size:2.4rem;color:var(--sage);line-height:1;}
.mscore-label{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--txt3);margin-top:4px;}
.mscore-row{display:flex;gap:20px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
.mscore-item{flex:1;text-align:center;}
.mscore-val{font-family:'DM Mono',monospace;font-size:1.1rem;color:var(--txt);}
.mscore-lbl{font-size:.65rem;letter-spacing:.05em;text-transform:uppercase;color:var(--txt3);margin-top:3px;}
/* scoring legend */
.score-legend{margin:14px 16px 0;padding:12px 14px;background:var(--surf);border:1px solid var(--border);border-radius:12px;font-size:.72rem;color:var(--txt2);line-height:1.7;}
.score-legend b{color:var(--txt);}
/* export */
.export-panel{margin:16px 16px 0;background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:16px;}
.export-row{display:flex;gap:10px;margin-top:10px;}
.exp-btn{flex:1;padding:12px 0;border-radius:10px;border:1px solid var(--border);background:var(--surf2);font-size:.78rem;font-weight:700;color:var(--txt2);cursor:pointer;text-align:center;transition:all .15s;}
.exp-btn.primary{background:var(--sage-d);border-color:var(--sage);color:var(--sage);}
.exp-btn:active{transform:scale(.97);}
.exp-icon{font-size:1.1rem;display:block;margin-bottom:4px;}
/* extend months */
.extend-btn{display:block;width:calc(100% - 32px);margin:16px 16px 0;padding:14px;border-radius:12px;border:1px dashed var(--border);background:transparent;font-size:.85rem;font-weight:600;color:var(--txt3);cursor:pointer;}
.extend-btn:active{background:var(--surf2);}
.sec-pad{padding:0 0 120px;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--txt);border-radius:20px;padding:9px 18px;font-size:.78rem;color:var(--white);opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:70;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.chevron{transition:transform .2s;display:inline-block;color:var(--txt3);font-size:.8rem;}
.chevron.open{transform:rotate(90deg);}

/* ── Food log chips ── */
.food-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.food-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 8px 5px 11px;border-radius:20px;border:1px solid var(--border);background:var(--surf);font-size:.72rem;font-weight:600;color:var(--txt2);cursor:pointer;transition:all .15s;user-select:none;}
.food-chip.selected{background:var(--sage-d);border-color:var(--sage);color:var(--sage);}
.food-chip:active{transform:scale(.95);}
.food-chip-del{width:14px;height:14px;border-radius:50%;background:rgba(0,0,0,.1);border:none;font-size:9px;color:currentColor;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;line-height:1;}
.food-chip.selected .food-chip-del{background:rgba(74,128,80,.2);}
.food-chip-add{display:flex;gap:6px;margin-top:4px;}
.food-log-add-inp{flex:1;background:var(--surf);border:1px solid var(--border);border-radius:20px;padding:7px 13px;font-family:'DM Sans',sans-serif;font-size:.78rem;color:var(--txt);outline:none;}
.food-log-add-inp:focus{border-color:var(--sage);}
.food-log-add-inp::placeholder{color:var(--txt3);}
.food-log-add-btn{padding:7px 13px;border-radius:20px;border:none;background:var(--sage);color:#fff;font-size:.75rem;font-weight:700;cursor:pointer;white-space:nowrap;}
.food-log-label{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3);margin-bottom:5px;margin-top:8px;}
/* order reminder */
.order-reminder{font-size:.7rem;color:var(--terra);font-style:italic;margin-bottom:8px;padding:5px 8px;background:var(--terra-d);border-radius:6px;}
.order-reminder-done{font-size:.7rem;color:var(--sage);font-style:italic;margin-bottom:8px;padding:5px 8px;background:var(--sage-d);border-radius:6px;}

/* ── Meal plan tab ── */
.nav-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surf);position:sticky;top:57px;z-index:40;}
.ntab{flex:1;padding:11px 4px;text-align:center;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);cursor:pointer;border-bottom:2px solid transparent;transition:all .18s;}
.ntab.active{color:var(--sage);border-bottom-color:var(--sage);}
.meal-plan-section{margin:16px;background:var(--surf);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.mp-meal{border-bottom:1px solid var(--border);padding:14px;}
.mp-meal:last-child{border-bottom:none;}
.mp-meal-name{font-size:.82rem;font-weight:700;color:var(--txt);margin-bottom:6px;}
.mp-items{display:flex;flex-wrap:wrap;gap:5px;}
.mp-item{padding:4px 10px;border-radius:20px;background:var(--sage-d);border:1px solid rgba(74,128,80,.2);font-size:.72rem;color:var(--sage);}
.mp-empty{font-size:.78rem;color:var(--txt3);font-style:italic;}

/* ── Weekly progress card ── */
.weekly-progress{margin:16px;padding:16px;background:linear-gradient(135deg,var(--sage-d) 0%,var(--surf) 100%);border:1px solid rgba(74,128,80,.25);border-radius:14px;}
.wp-title{font-family:'Playfair Display',serif;font-size:1rem;color:var(--txt);margin-bottom:12px;}
.wp-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;}
.wp-stat{text-align:center;background:var(--surf);border-radius:10px;padding:10px 6px;}
.wp-val{font-family:'DM Mono',monospace;font-size:1.1rem;font-weight:500;}
.wp-lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--txt3);margin-top:3px;}
.wp-bar-row{display:flex;gap:3px;align-items:flex-end;height:40px;margin-bottom:8px;}
.wp-bar{flex:1;border-radius:3px 3px 0 0;min-height:3px;}
.wp-days{display:flex;gap:3px;margin-bottom:10px;}
.wp-day-lbl{flex:1;font-size:.6rem;text-align:center;color:var(--txt3);}
.wp-share-btn{width:100%;padding:10px;border-radius:8px;border:1px solid var(--sage);background:transparent;color:var(--sage);font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:700;cursor:pointer;}
.wp-share-btn:active{background:var(--sage-d);}

/* ── Compliance share pill ── */
.share-panel{margin:16px;padding:14px;background:var(--surf);border:1px solid var(--border);border-radius:14px;}
.share-panel-title{font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--txt3);margin-bottom:10px;}

/* ── View toggle ── */
.view-toggle{display:none;}
.view-panel{display:none;}
.view-panel.active{display:block;}
#pwGate{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(32px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom)) 24px;background:var(--bg);overflow-y:auto;}
.pw-logo{font-family:'Playfair Display',serif;font-size:42px;font-weight:900;color:var(--txt);margin-bottom:5px;}
.pw-logo span{color:var(--sage);}
.pw-sub{color:var(--txt3);font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:44px;}
.pw-card{background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:28px;width:100%;max-width:360px;}
.pw-label{display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--txt3);margin-bottom:7px;}
.pw-input{width:100%;background:var(--surf2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:16px;outline:none;transition:border-color .2s;margin-bottom:16px;-webkit-appearance:none;}
.pw-input:focus{border-color:var(--sage);}
.pw-btn{width:100%;padding:14px;background:var(--sage);color:#fff;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;transition:opacity .2s;}
.pw-btn:active{opacity:.82;}
.pw-error{color:var(--terra);font-size:12px;text-align:center;margin-top:10px;min-height:18px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="pwGate">
  <div class="pw-logo">K<span class="g">F</span><span class="t">it</span> Nutrition</div>
  <div class="pw-sub">Nutrition Tracker</div>
  <div class="pw-card">
    <div style="display:flex;gap:0;margin-bottom:20px;border:1px solid var(--border);border-radius:10px;overflow:hidden;">
      <button id="tabPw" onclick="switchLoginTab('pw')" style="flex:1;padding:10px;background:var(--sage);border:none;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:700;color:#fff;cursor:pointer;">First Time</button>
      <button id="tabMobile" onclick="switchLoginTab('mobile')" style="flex:1;padding:10px;background:transparent;border:none;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:700;color:var(--txt2);cursor:pointer;">Returning</button>
    </div>
    <div id="loginTabPw">
      <label class="pw-label">Access Password</label>
      <input class="pw-input" type="password" id="pwInput" placeholder="Enter your password" onkeydown="if(event.key==='Enter')checkPw()">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;margin-top:-8px;">
        <input type="checkbox" id="rememberMe" checked style="width:16px;height:16px;accent-color:var(--sage);cursor:pointer;">
        <label for="rememberMe" style="font-size:.75rem;color:var(--txt2);cursor:pointer;">Keep me logged in</label>
      </div>
      <button class="pw-btn" onclick="checkPw()">Unlock →</button>
    </div>
    <div id="loginTabMobile" style="display:none;">
      <label class="pw-label">Your Mobile Number</label>
      <input class="pw-input" type="tel" id="mobileLoginInput" placeholder="e.g. 9820012345" onkeydown="if(event.key==='Enter')checkMobileLogin()">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;margin-top:-8px;">
        <input type="checkbox" id="rememberMeMobile" checked style="width:16px;height:16px;accent-color:var(--sage);cursor:pointer;">
        <label for="rememberMeMobile" style="font-size:.75rem;color:var(--txt2);cursor:pointer;">Keep me logged in</label>
      </div>
      <button class="pw-btn" onclick="checkMobileLogin()">Sign In →</button>
    </div>
    <div class="pw-error" id="pwError"></div>
    <div id="installWrap" style="margin-top:16px;border-top:1px solid var(--border);padding-top:16px;">
      <button id="installBtn" onclick="triggerInstall()" style="width:100%;padding:12px;background:transparent;border:1px solid var(--sage);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:700;color:var(--sage);cursor:pointer;">📲 Add to Home Screen</button>
    </div>
  </div>
</div>

<!-- Mobile number prompt modal -->
<div id="mobilePromptModal" style="display:none;position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.75);align-items:center;justify-content:center;padding:24px;">
  <div style="background:var(--surf);border-radius:16px;padding:28px 24px;width:100%;max-width:380px;">
    <div style="font-size:16px;font-weight:700;color:var(--txt);margin-bottom:6px;">📱 Add your mobile number</div>
    <div style="font-size:13px;color:var(--txt2);margin-bottom:20px;">This lets you sign in from any device — no password needed next time.</div>
    <input type="tel" id="mobilePromptInput" class="pw-input" placeholder="e.g. 9820012345" style="margin-bottom:12px;">
    <button onclick="saveMobilePrompt()" style="width:100%;padding:13px;background:var(--sage);border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:700;color:#fff;cursor:pointer;margin-bottom:8px;">Save</button>
    <button onclick="dismissMobilePrompt()" style="width:100%;padding:11px;background:transparent;border:none;font-family:'DM Sans',sans-serif;font-size:.85rem;color:var(--txt3);cursor:pointer;">Skip for now</button>
  </div>
</div>

<!-- iOS install guide modal -->
<div id="installModal" style="display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.75);align-items:flex-end;justify-content:center;">
  <div style="background:var(--surf);border-radius:16px 16px 0 0;padding:28px 24px 44px;width:100%;max-width:420px;">
    <div style="font-size:16px;font-weight:700;color:var(--txt);margin-bottom:6px;">📲 Add to Home Screen</div>
    <div id="installInstructions" style="font-size:13px;color:var(--txt2);margin-bottom:20px;"></div>
    <button onclick="document.getElementById('installModal').style.display='none'" style="width:100%;padding:13px;background:var(--sage);border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:700;color:#fff;cursor:pointer;">Got it</button>
  </div>
</div>

<div id="mainContent" style="display:none;">
<div class="topbar">
  <div>
    <div class="brand">K<span class="g">F</span><span class="t">it</span> Nutrition</div>
    <div id="headerClientName" style="font-size:11px;color:var(--txt3);margin-top:1px;font-family:'DM Sans',sans-serif;"></div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <div class="save-pill" id="savePill">✓ Saved</div>
    <button onclick="logout()" style="background:transparent;border:1px solid var(--border);border-radius:8px;padding:5px 11px;font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:600;color:var(--txt3);cursor:pointer;">Log Out</button>
  </div>
</div>

<!-- SNAP MODAL -->

}

function calcMealMacros(m,w,di,mealId){
  var dd=data[m]&&data[m][w]&&data[m][w][di]?data[m][w][di]:{};
  var fl=dd.foodLog&&dd.foodLog[mealId]?dd.foodLog[mealId]:[];
  var totals={cal:0,p:0,c:0,f:0,known:0};
  fl.forEach(function(food){
    var mac=getMacros(food);
    if(mac){totals.cal+=mac.cal;totals.p+=mac.p;totals.c+=mac.c;totals.f+=mac.f;totals.known++;}
  });
  return fl.length?totals:null;
}

function calcDayMacros(m,w,di){
  var dd=data[m]&&data[m][w]&&data[m][w][di]?data[m][w][di]:{};
  var totals={cal:0,p:0,c:0,f:0};
  var hasMacros=false;
  var meals=appSetup&&appSetup.meals?appSetup.meals:[];
  meals.forEach(function(meal){
    var fl=dd.foodLog&&dd.foodLog[meal.id]?dd.foodLog[meal.id]:[];
    fl.forEach(function(food){
      var mac=getMacros(food);
      if(mac){totals.cal+=mac.cal;totals.p+=mac.p;totals.c+=mac.c;totals.f+=mac.f;hasMacros=true;}
    });
  });
  return hasMacros?totals:null;
}

function loadFromSupabase(callback){
  var key=getClientKey();
  getSB().from('tracker_data').select('data').eq('client_id',key).eq('tracker','nutrition').then(function(res){
    if(res.error||!res.data||!res.data.length){
      // Fallback: search by name for existing clients
      var name=appSetup&&appSetup.clientName?appSetup.clientName.toLowerCase().replace(/\s+/g,'_'):'';
      if(!name){callback(false);return;}
      getSB().from('tracker_data').select('data').eq('client_id',name).eq('tracker','nutrition').then(function(res2){
        if(res2.error||!res2.data||!res2.data.length){callback(false);return;}

        if(d.ui)ui=d.ui;

        localStorage.setItem(LS_DATA,JSON.stringify(data));
        localStorage.setItem(LS_NOTES,JSON.stringify({weekNotes:weekNotes,ui:ui}));
        syncToSupabase(); // migrate to UID key
        callback(true);
      });

    if(d.weekNotes)weekNotes=d.weekNotes;
    if(d.ui)ui=d.ui;

    localStorage.setItem(LS_DATA,JSON.stringify(data));
    localStorage.setItem(LS_NOTES,JSON.stringify({weekNotes:weekNotes,ui:ui}));
    callback(true);
  });
}

function dlFile(content,filename,mime){
  var blob=new Blob([content],{type:mime});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.parentNode.removeChild(a);},300);
}
function stamp(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function exportAll(fmt){
  if(!appSetup){showToast('No data to export');return;}
  if(fmt==='json'){
    dlFile(JSON.stringify({app:'KFit Nutrition Tracker',exported:new Date().toISOString(),setup:appSetup,data:data,weekNotes:weekNotes},null,2),'km-nutrition-'+stamp()+'.json','application/json');
  } else {
    var rows=['Month,Week,Day,Date,Breakfast,Morn Snack,Lunch,Eve Snack,Dinner,Habits Done,Day Score,Notes'];
    var cal=buildCalendar();
    for(var m=0;m<cal.length;m++){
      for(var w=0;w<cal[m].length;w++){
        for(var d2=0;d2<cal[m][w].length;d2++){
          var day=cal[m][w][d2];if(!day.active)continue;
          var dd=data[m]&&data[m][w]&&data[m][w][d2]?data[m][w][d2]:{meals:{},habits:{}};
          var mScores=MEALS.map(function(ml){return dd.meals[ml.id]||0;});
          var hCount=HABITS.filter(function(h){return dd.habits[h.id];}).length;
          var dayScore=calcDayScore(dd);
          rows.push(['Month '+(m+1),'Week '+(w+1),DAYS_SHORT[day.dow],day.dateStr,mScores[0],mScores[1],mScores[2],mScores[3],mScores[4],hCount,dayScore.toFixed(0),'"'+(dd.note||'')+'"'].join(','));
        }
      }
    }
    dlFile(rows.join('\n'),'km-nutrition-'+stamp()+'.csv','text/csv');
  }
  showToast('Saved to Downloads / Files app');
}

// ── CALENDAR BUILDER ──
function buildCalendar(){
  // Returns array of months, each an array of weeks, each an array of days
  // Each day: {active:bool, dow:0-6, dateStr:'Tue 13 May', date:Date}
  if(!appSetup)return[];
  var start=new Date(appSetup.startDate+'T00:00:00');
  var totalMonths=appSetup.totalMonths||3;
  var cal=[];
  for(var m=0;m<totalMonths;m++){
    var monthDays=[];
    var monthStart=new Date(start);
    monthStart.setMonth(monthStart.getMonth()+m);
    // Start of this month's tracking block
    var blockStart=new Date(monthStart);
    var blockEnd=new Date(blockStart);
    blockEnd.setMonth(blockEnd.getMonth()+1);
    blockEnd.setDate(blockEnd.getDate()-1);
    // Find Sunday on or before blockStart
    var wsStart=new Date(blockStart);
    wsStart.setDate(wsStart.getDate()-wsStart.getDay());
    // Build weeks
    var weeks=[];
    var cur=new Date(wsStart);
    while(cur<=blockEnd){
      var week=[];
      for(var d=0;d<7;d++){
        var dt=new Date(cur);
        var active=dt>=blockStart&&dt<=blockEnd;
        var dateStr=DAYS_SHORT[dt.getDay()]+' '+dt.getDate()+' '+MONTHS_LONG[dt.getMonth()].substring(0,3);
        week.push({active:active,dow:dt.getDay(),dateStr:dateStr,date:new Date(dt)});
        cur.setDate(cur.getDate()+1);
      }
      weeks.push(week);
    }
    cal.push(weeks);
  }
  return cal;
}

// ── SCORING ──
function calcDayScore(dd){
  if(!dd)return 0;
  var total=0,max=0;
  MEALS.forEach(function(m){
    var s=(dd.meals&&dd.meals[m.id])||0;
    if(s>0){           // only count meals that were actually eaten
      max+=3;total+=s; // meal quality: 1-3
      max+=1;          // order of eating: +1 bonus slot
      if(dd.order&&dd.order[m.id])total+=1;
    }
  });
  HABITS.forEach(function(h){max+=1;total+=(dd.habits&&dd.habits[h.id])?1:0;});
  return max>0?Math.round(total/max*100):0;
}
function calcWeekScore(m,w,cal){
  if(!cal||!cal[m]||!cal[m][w])return null;
  var scores=[];
  cal[m][w].forEach(function(day,di){
    if(!day.active)return;
    var dd=data[m]&&data[m][w]&&data[m][w][di]?data[m][w][di]:null;
    if(dd)scores.push(calcDayScore(dd));
  });
  if(!scores.length)return null;
  return Math.round(scores.reduce(function(a,b){return a+b;},0)/scores.length);
}
function scoreColor(s){
  if(s===null||s===undefined)return 'var(--txt3)';
  if(s>=75)return 'var(--score-high)';
  if(s>=50)return 'var(--score-mid)';
  return 'var(--score-low)';
}

function calcStreak(cal){
  var streak=0;
  var today=new Date();today.setHours(0,0,0,0);
  var allDays=[];
  cal.forEach(function(monthCal,m){
    monthCal.forEach(function(wk,w){
      wk.forEach(function(day,di){
        if(!day.active)return;
        var dd=data[m]&&data[m][w]&&data[m][w][di]?data[m][w][di]:null;
        allDays.push({date:day.date,scored:dd&&calcDayScore(dd)>0});
      });
    });
  });
  allDays.sort(function(a,b){return b.date-a.date;});
  for(var i=0;i<allDays.length;i++){
    if(allDays[i].scored)streak++;
    else break;
  }
  return streak;
}

  var avg=allScores.length?Math.round(allScores.reduce(function(a,b){return a+b;},0)/allScores.length):0;

  // count total active days
  var totalActive=0;
  weeks.forEach(function(wk){wk.forEach(function(day){if(day.active)totalActive++;});});
  return '<div class="month-summary">'
    +'<div style="display:flex;align-items:flex-end;gap:16px;">'
    +'<div><div class="mscore" style="color:'+scoreColor(avg)+'">'+avg+'<span style="font-size:1.2rem;">%</span></div>'
    +'<div class="mscore-label">Month '+(m+1)+' Average</div></div>'
    +'<div style="flex:1;text-align:right;">'
    +(appSetup.clientName?'<div style="font-family:\'Playfair Display\',serif;font-size:.95rem;color:var(--txt);">'+appSetup.clientName+'</div>':'')
    +'</div></div>'
    +'<div class="mscore-row">'
    +'<div class="mscore-item"><div class="mscore-val">'+daysLogged+'</div><div class="mscore-lbl">Days Logged</div></div>'
    +'<div class="mscore-item"><div class="mscore-val">'+totalActive+'</div><div class="mscore-lbl">Total Days</div></div>'
    +'<div class="mscore-item"><div class="mscore-val" style="color:'+scoreColor(avg)+'">'+avg+'%</div><div class="mscore-lbl">Compliance</div></div>'
    +'</div></div>';
}

function renderWeek(m,w,cal){
  var weeks=cal[m]||[];
  var wk=weeks[w]||[];
  var activeDays=wk.filter(function(d){return d.active;});
  var wScore=calcWeekScore(m,w,cal);
  var isOpen=ui.expandedWeeks[m+'-'+w];
  var wn=weekNotes[m]&&weekNotes[m][w]?weekNotes[m][w]:'';
  var html='<div class="week-section">'
    +'<div class="week-head" onclick="toggleWeek('+m+','+w+')">'
    +'<div><div class="week-label">Week '+(w+1)+'</div>'
    +'<div style="font-size:.68rem;color:var(--txt3);">'
    +(activeDays.length?activeDays[0].dateStr+' — '+activeDays[activeDays.length-1].dateStr:'')
    +'</div></div>'
    +'<div style="display:flex;align-items:center;gap:10px;">'
    +(wScore!==null?'<div class="week-score" style="color:'+scoreColor(wScore)+'">'+wScore+'%</div>':'')
    +'<span class="chevron'+(isOpen?' open':'')+'">&#9654;</span>'
    +'</div></div>'
    +'<div class="week-body'+(isOpen?' open':'')+'" id="wb'+m+'_'+w+'">';
  if(isOpen){
    // Day strip
    html+='<div class="day-strip">';
    wk.forEach(function(day,di){
      if(!day.active)return;
      var dd=data[m]&&data[m][w]&&data[m][w][di]?data[m][w][di]:null;
      var hasData=dd&&(Object.values(dd.meals||{}).some(function(v){return v>0;})||Object.values(dd.habits||{}).some(Boolean));
      var isActive=ui.activeMonth===m&&ui.activeWeek===w&&ui.activeDay===di;
      html+='<div class="dtab'+(isActive?' active':'')+(hasData?' done':'')+'" onclick="setDay('+m+','+w+','+di+')">'+day.dateStr.split(' ')[0]+'<br><span style="font-size:.7rem;">'+day.dateStr.split(' ')[1]+'</span></div>';
    });
    html+='</div>';
    // Active day panel
    var activeInWeek=wk.findIndex(function(d,di){return d.active&&ui.activeMonth===m&&ui.activeWeek===w&&ui.activeDay===di;});
    if(activeInWeek===-1){
      // show first active day
      var firstActive=wk.findIndex(function(d){return d.active;});
      if(firstActive>-1){html+=renderDayPanel(m,w,firstActive,cal);}
    } else {
      html+=renderDayPanel(m,w,ui.activeDay,cal);
    }
    // Week summary bar
    html+=renderWeekSummary(m,w,cal,wn);
  }
  html+='</div></div>';
  return html;
}

      +'</div>'

function renderWeekSummary(m,w,cal,wn){
  var weeks=cal[m]||[];var wk=weeks[w]||[];
  var scores=[];
  wk.forEach(function(day,di){
    if(!day.active)return;
    var dd=data[m]&&data[m][w]&&data[m][w][di]?data[m][w][di]:null;
    scores.push(dd?calcDayScore(dd):null);
  });
  var validScores=scores.filter(function(s){return s!==null;});
  var avg=validScores.length?Math.round(validScores.reduce(function(a,b){return a+b;},0)/validScores.length):0;
  var maxScore=Math.max.apply(null,validScores.length?validScores:[1]);
  var html='<div class="week-summary">'
    +'<div class="wsum-title">Week Summary</div>'
    +'<div class="wsum-bars">';
  scores.forEach(function(s){
    var pct=s!==null&&maxScore>0?(s/100)*100:0;
    html+='<div class="wbar" style="height:'+Math.max(pct,4)+'%;background:'+(s!==null?scoreColor(s):'var(--border)')+';" title="'+(s!==null?s+'%':'Not logged')+'"></div>';
  });
  html+='</div>'
    +'<div class="wsum-row"><span>Avg: <b style="color:'+scoreColor(avg)+'">'+avg+'%</b></span>'
    +'<span>Days logged: '+validScores.length+'/'+scores.length+'</span></div>'
    +'<textarea class="week-notes-inp" placeholder="Week notes / coach observations..." rows="2"'
    +' onchange="setWeekNote('+m+','+w+',this.value)"'
    +' oninput="setWeekNote('+m+','+w+',this.value)">'+wn+'</textarea>'
    +'</div>';
  return html;
}

// ── EVENT HANDLERS ──
function bindTrackerEvents(){}
function setMonth(m){ui.activeMonth=m;render();}
function toggleWeek(m,w){
  var key=m+'-'+w;
  ui.expandedWeeks[key]=!ui.expandedWeeks[key];
  if(ui.expandedWeeks[key]){
    ui.activeWeek=w;
    // Set first active day
    var cal=buildCalendar();
    var wk=(cal[m]&&cal[m][w])||[];
    var first=wk.findIndex(function(d){return d.active;});
    if(first>-1)ui.activeDay=first;
  }
  autoSave();render();
}
function setDay(m,w,di){ui.activeMonth=m;ui.activeWeek=w;ui.activeDay=di;autoSave();render();}
function addMonth(){appSetup.totalMonths=(appSetup.totalMonths||3)+1;autoSave();render();showToast('Month added');}

function ensureData(m,w,di){
  if(!data[m])data[m]=[];
  if(!data[m][w])data[m][w]=[];
  if(!data[m][w][di])data[m][w][di]={meals:{},mealNotes:{},habits:{},order:{},note:''};
  if(!data[m][w][di].order)data[m][w][di].order={};
}
function setMeal(m,w,di,mealId,score){
  ensureData(m,w,di);
  data[m][w][di].meals[mealId]=score;
  // If meal is being skipped, clear its order flag
  if(score===0)data[m][w][di].order[mealId]=false;
  autoSave();render();
}
function setOrder(m,w,di,mealId){
  ensureData(m,w,di);
  data[m][w][di].order[mealId]=!data[m][w][di].order[mealId];
  autoSave();render();
}
function setMealNote(m,w,di,mealId,val){
  ensureData(m,w,di);
  if(!data[m][w][di].mealNotes)data[m][w][di].mealNotes={};
  data[m][w][di].mealNotes[mealId]=val;
  autoSave();
}
function toggleHabit(m,w,di,hid){
  ensureData(m,w,di);
  data[m][w][di].habits[hid]=!data[m][w][di].habits[hid];
  autoSave();render();
}
function setDayNote(m,w,di,val){
  ensureData(m,w,di);
  data[m][w][di].note=val;
  autoSave();
}
function setWeekNote(m,w,val){
  if(!weekNotes[m])weekNotes[m]=[];
  weekNotes[m][w]=val;
  autoSave();
}
function toggleFood(m,w,di,mealId,food){
  ensureData(m,w,di);
  if(!data[m][w][di].foodLog)data[m][w][di].foodLog={};
  if(!data[m][w][di].foodLog[mealId])data[m][w][di].foodLog[mealId]=[];
  var fl=data[m][w][di].foodLog[mealId];
  var idx=fl.indexOf(food);
  if(idx>-1)fl.splice(idx,1);
  else fl.push(food);
  autoSave();render();
}
function addCustomFood(m,w,di,mealId){
  var inp=document.getElementById('fi-'+m+'-'+w+'-'+di+'-'+mealId);
  if(!inp)return;
  var val=inp.value.trim();
  if(!val){showToast('Type a food first');return;}
  ensureData(m,w,di);
  if(!data[m][w][di].customFoods)data[m][w][di].customFoods={};
  if(!data[m][w][di].customFoods[mealId])data[m][w][di].customFoods[mealId]=[];
  if(data[m][w][di].customFoods[mealId].indexOf(val)<0){
    data[m][w][di].customFoods[mealId].push(val);
  }
  // Also auto-select it
  if(!data[m][w][di].foodLog)data[m][w][di].foodLog={};
  if(!data[m][w][di].foodLog[mealId])data[m][w][di].foodLog[mealId]=[];
  if(data[m][w][di].foodLog[mealId].indexOf(val)<0){
    data[m][w][di].foodLog[mealId].push(val);
  }
  autoSave();
  // Ask for macros if not already known
  if(!getMacros(val)){
    var enterMacros=confirm('"'+val+'" is not in the macro database.\n\nWould you like to add its approximate macros?\n(You can skip — it just won\'t be tracked in totals)');
    if(enterMacros){
      var cal=parseInt(prompt('Calories (kcal) per serving of '+val+':')||'0');
      var p=parseInt(prompt('Protein (g):')||'0');
      var c=parseInt(prompt('Carbs (g):')||'0');
      var f=parseInt(prompt('Fat (g):')||'0');
      if(cal||p||c||f){
        saveCustomMacro(val,{cal:cal,p:p,c:c,f:f,srv:'1 serving'});
      }
    }
  }
  render();
}

function deleteFood(m,w,di,mealId,food,isCustom){
  if(!confirm('Remove "'+food+'" from this meal?'))return;
  ensureData(m,w,di);
  // Remove from food log if selected
  if(data[m][w][di].foodLog&&data[m][w][di].foodLog[mealId]){
    var idx=data[m][w][di].foodLog[mealId].indexOf(food);
    if(idx>-1)data[m][w][di].foodLog[mealId].splice(idx,1);
  }
  // Remove from custom foods if it's custom
  if(isCustom&&data[m][w][di].customFoods&&data[m][w][di].customFoods[mealId]){
    var idx2=data[m][w][di].customFoods[mealId].indexOf(food);
    if(idx2>-1)data[m][w][di].customFoods[mealId].splice(idx2,1);
  }
  autoSave();render();
}
function setFoodText(m,w,di,mealId,val){
  ensureData(m,w,di);
  if(!data[m][w][di].foodText)data[m][w][di].foodText={};
  data[m][w][di].foodText[mealId]=val;
  autoSave();
}

function viewPhoto(url){
  var overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.onclick=function(){document.body.removeChild(overlay);};
  var img=document.createElement('img');
  img.src=url;
  img.style.cssText='max-width:100%;max-height:90vh;border-radius:10px;object-fit:contain;';
  overlay.appendChild(img);
  document.body.appendChild(overlay);
}

function deletePhoto(m,w,di,mealId,idx){
  if(!confirm('Delete this photo?'))return;
  ensureData(m,w,di);
  if(data[m][w][di].photos&&data[m][w][di].photos[mealId]){
    data[m][w][di].photos[mealId].splice(idx,1);
  }
  autoSave();render();
}

// ── GEMINI FOOD ANALYSIS ──
var geminiMacros=null;

function analyseWithGemini(){
  if(!snapFile){showToast('No photo to analyse');return;}
  var btn=document.getElementById('analyseBtn');
  var resultEl=document.getElementById('geminiResult');
  btn.textContent='🔍 Analysing...';
  btn.disabled=true;
  geminiMacros=null;

  // Compress before sending to Gemini — smaller = faster + less quota
  compressImage(snapFile, 256, 0.5, function(blob){
    var reader2=new FileReader();
    reader2.onload=function(e){
      var base64=e.target.result.split(',')[1];
    var prompt='You are a nutrition expert. Analyse this food image carefully. '
      +'Identify every food item visible, estimate realistic portion sizes based on visual cues, '
      +'and calculate approximate macros. '
      +'Return ONLY a valid JSON object with no markdown, no explanation, exactly this structure: '
      +'{"foods":[{"name":"food name","portion":"estimated portion e.g. 150g or 1 cup","cal":0,"p":0,"c":0,"f":0}],'
      +'"total":{"cal":0,"p":0,"c":0,"f":0},'
      +'"notes":"any relevant notes about the meal"}';

    fetch(GEMINI_WORKER,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        contents:[{parts:[
          {text:prompt},
          {inline_data:{mime_type:'image/jpeg',data:base64}}
        ]}],
        generationConfig:{temperature:0.1,maxOutputTokens:1024}
      })
    })
    .then(function(r){return r.json();})
    .then(function(data){
      btn.textContent='🔍 Analyse Macros with AI';
      btn.disabled=false;
      if(data.error){
        resultEl.style.display='block';
        resultEl.innerHTML='<div style="color:var(--terra);font-size:12px;padding:8px;">Error: '+data.error.message+'</div>';
        return;
      }
      var text=data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts[0].text;

// ── PHOTO UPLOAD TO SUPABASE STORAGE ──
function compressImage(file, maxW, quality, callback){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var scale=Math.min(1, maxW/img.width);
      var w=Math.round(img.width*scale);
      var h=Math.round(img.height*scale);
      var canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      canvas.toBlob(function(blob){ callback(blob); },'image/jpeg',quality);
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function setCookie(name,val,days){
  var d=new Date();d.setTime(d.getTime()+(days*24*60*60*1000));
  document.cookie=name+'='+val+';expires='+d.toUTCString()+';path=/;SameSite=Lax';
}
function getCookie(name){
  var v=document.cookie.match('(^|;)\\s*'+name+'\\s*=\\s*([^;]+)');
  return v?v.pop():null;
}
function clearCookie(name){
  document.cookie=name+'=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/';
}

function isUnlocked(){
  return localStorage.getItem('kmnut_v2')==='1'||getCookie('kmnut_unlocked')==='1';
}

function setUnlocked(){
  localStorage.setItem('kmnut_v2','1');
  setCookie('kmnut_unlocked','1',365);
  try{
    var req=indexedDB.open('kmnut_auth',1);
    req.onupgradeneeded=function(e){e.target.result.createObjectStore('flags');};
    req.onsuccess=function(e){
      var tx=e.target.result.transaction('flags','readwrite');
      var store=tx.objectStore('flags');
      store.put('1','unlocked');
      var mobile=localStorage.getItem('kmnut_mobile');
      var setup=localStorage.getItem('km_nut_setup');
      if(mobile) store.put(mobile,'mobile');
      if(setup) store.put(setup,'setup');
    };
  }catch(e){}
}

function checkUnlockedIDB(callback){
  try{
    var req=indexedDB.open('kmnut_auth',1);
    req.onupgradeneeded=function(e){e.target.result.createObjectStore('flags');};
    req.onsuccess=function(e){
      var db=e.target.result;
      var tx=db.transaction('flags','readonly');
      var store=tx.objectStore('flags');
      store.get('unlocked').onsuccess=function(ev){
        if(ev.target.result==='1'){
          store.get('mobile').onsuccess=function(e2){
            if(e2.target.result) localStorage.setItem('kmnut_mobile',e2.target.result);
            store.get('setup').onsuccess=function(e3){
              if(e3.target.result) localStorage.setItem('km_nut_setup',e3.target.result);
              callback(true);
            };
          };
        } else { callback(false); }
      };
    };
    req.onerror=function(){callback(false);};
  }catch(e){callback(false);}
}

function logout(){
  localStorage.removeItem('kmnut_v2');
  clearCookie('kmnut_unlocked');
  sessionStorage.removeItem('kmnut_session');
  try{

    req.onsuccess=function(e){
      var tx=e.target.result.transaction('flags','readwrite');

          caches.open(V).then(c=>c.addAll([self.location.href.replace(/\\/sw.*$/,'')]))
        ));
        self.addEventListener('activate',e=>e.waitUntil(
          caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==V).map(k=>caches.delete(k))))
        ));
        self.addEventListener('fetch',e=>e.respondWith(
          caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{
            const clone=res.clone();
            caches.open(V).then(c=>c.put(e.request,clone));

          }))
        ));`;
      const swBlob=new Blob([sw],{type:'text/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(swBlob),{scope:'./'}).catch(()=>{});
